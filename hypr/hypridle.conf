general {
    lock_cmd = /home/tirbofish/.config/hypr/scripts/lock.sh
    before_sleep_cmd = /home/tirbofish/.config/hypr/scripts/pre-sleep.sh
    after_sleep_cmd = /home/tirbofish/.config/hypr/scripts/post-sleep.sh
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    inhibit_sleep = 3
}

listener {
    timeout = 540
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 540
    on-timeout = brightnessctl -sd *::kbd_backlight set 0
    on-resume = brightnessctl -rd *::kbd_backlight
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    ignore_inhibit = true
    condition_cmd = pidof hyprlock >/dev/null
    condition_retry = 10
}

listener {
    timeout = 1200
    on-timeout = python3 /home/tirbofish/.config/hypr/scripts/music-guard.py suspend
    condition_cmd = python3 /home/tirbofish/.config/hypr/scripts/music-guard.py can-suspend
    condition_retry = 10
}

listener {
    timeout = 1200
    on-timeout = python3 /home/tirbofish/.config/hypr/scripts/music-guard.py suspend
    ignore_inhibit = true
    condition_cmd = pidof hyprlock >/dev/null && python3 /home/tirbofish/.config/hypr/scripts/music-guard.py can-suspend
    condition_retry = 10
}
