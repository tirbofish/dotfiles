[general]
framerate = 30
bars = 40
autosens = 1
sensitivity = 100
lower_cutoff_freq = 50
higher_cutoff_freq = 10000
sleep_timer = 0

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 8
channels = mono
mono_option = average

[smoothing]
monstercat = 1
noise_reduction = 80
