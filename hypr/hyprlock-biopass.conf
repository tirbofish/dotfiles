# Biopass on hyprlock.
#
# After lock: wait lock_buffer seconds, then keep Biopass on for
# var_timeout seconds. When that window ends, the next password
# keystroke starts another var_timeout window.

# Seconds Biopass stays on after it starts.
var_timeout = 5

# Seconds to wait after the lock screen appears before starting Biopass.
lock_buffer = 1
