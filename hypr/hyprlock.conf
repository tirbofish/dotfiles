## -----------------------------------------------------
#  Hyprlock theme by @snes19xx
## -----------------------------------------------------

source = ~/.cache/wal/tirbofish-hyprlock.conf


general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
    hide_cursor = true
    ignore_empty_input = false
}

# Password via PAM. Biopass is started by lock.sh after lock_buffer,
# and stays on for var_timeout (see hyprlock-biopass.conf).
auth {
    pam {
        enabled = true
        module = hyprlock
    }
    fingerprint {
        enabled = false
    }
}

# -----------------------------------------------------
# BACKGROUND
# -----------------------------------------------------
background {
    monitor =
    path = $wal_wallpaper
    blur_passes = 0
    zindex = -2
}

# Dim overlay 
shape {
    monitor =
    size = 100%, 100%
    color = $wal_dim 
    zindex = -1
}


# -----------------------------------------------------
# STATUS BAR (Top Right - Battery)
# -----------------------------------------------------
label {
    monitor =
    text = cmd[update:2000] echo -e "$(cat /sys/class/power_supply/BAT*/capacity)% 󱈏"
    color = $wal_secondary
    font_size = 14
    font_family = Manrope Bold
    position = -40, -40
    halign = right
    valign = top
    
    shadow_passes = 0
}
# -----------------------------------------------------
# HEADER (Top Left - Date & Weather)
# -----------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %b %d")"
    color = $wal_foreground
    font_size = 22
    font_family = Manrope SemiBold
    
    position = 40, -40
    halign = left
    valign = top
    
    shadow_passes = 0
}

label {
    monitor =
    # %c = Icon, %C = Text Condition, %t = Temp
    text = cmd[update:1800000] echo "$(curl -s 'wttr.in?format=%c+%C,+%t'| tr -d '+')"
    color = $wal_foreground_dim
    font_size = 14
    font_family = Manrope Medium
    
    position = 40, -85
    halign = left
    valign = top
    
    shadow_passes = 0
}

# -----------------------------------------------------
# CLOCK 
# -----------------------------------------------------
# HOURS
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    color = $wal_accent
    
    font_size = 150
    font_family = Inter Medium

    # Positive Y moves up.
    position = 0, 80
    
    halign = center
    valign = center
    
    shadow_passes = 0
    shadow_size = 0
    shadow_color = $wal_shadow
}

# MINUTES
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = $wal_foreground

    font_size = 150

    font_family = Inter Medium
    # Negative Y moves down.
    position = 0, -115
    
    halign = center
    valign = center
    
    shadow_passes = 0
    shadow_size = 0
    shadow_color = $wal_shadow
}

# -----------------------------------------------------
# NOW PLAYING (Bottom Left)
# -----------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/whatsong.sh --title
    color = $wal_foreground
    font_size = 18
    font_family = Manrope Bold
    
    position = 50, 80
    halign = left
    valign = bottom
    
    shadow_passes = 1
}

label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/whatsong.sh --artist
    color = $wal_accent_dim
    font_size = 14
    font_family = Manrope Medium
    
    position = 50, 50
    halign = left
    valign = bottom
    
    shadow_passes = 1
}

# -----------------------------------------------------
# BIOPASS STATUS (above the password field)
# -----------------------------------------------------
label {
    monitor =
    text = cmd[update:200] ~/.config/hypr/scripts/hyprlock-biopass.sh status
    color = $wal_accent
    font_size = 13
    font_family = Manrope Medium
    position = 0, 140
    halign = center
    valign = bottom

    shadow_passes = 0
}

# -----------------------------------------------------
# INPUT FIELD (Bottom Center)
# -----------------------------------------------------
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true

    outer_color = $wal_accent_dim
    inner_color = $wal_background
    font_color = $wal_foreground
    check_color = $wal_secondary
    fail_color = $wal_danger
    
    fade_on_empty = true
    placeholder_text = <i>Unlock</i>
    hide_input = false
    
    rounding = -1
    
    position = 0, 80
    halign = center
    valign = bottom
    
    shadow_passes = 0
}
