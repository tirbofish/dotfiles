# Snappy Switcher Configuration
# Auto-generated default config

[general]
# mode = context | overview
mode = overview
# The QuickShell Displays panel pins this fixed panel to the selected primary output.
follow_monitor = false

[theme]
# Available: snappy-slate, tokyo-night, catppuccin-mocha,
#            dracula, nord, gruvbox-dark, rose-pine, etc.
name = snappy-slate.ini
background = #201818b8
card_bg = #201818cc
card_selected = #D2715666
border_color = #D27156ff
text_color = #ecbba7ff
subtext_color = #a58274ff
bundle_bg = #201818a6
badge_bg = #D27156e6
badge_text_color = #201818ff
badge_bg_selected = #E59550ff
badge_text_color_selected = #201818ff
border_width = 2
card_border_width = 1
corner_radius = 15

[icons]
theme = Tela-dracula
fallback = Tela-circle-dracula
show_letter_fallback = true

# See config.ini.example for all available options.
